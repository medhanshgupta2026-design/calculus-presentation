<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Calculus Lab Dashboard</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: rgba(15, 23, 42, 0.8);
            --bg-nested: #020617;
            --border-glow: #1e293b;
            --accent-emerald: #10b981;
            --accent-cyan: #06b6d4;
            --accent-violet: #8b5cf6;
            --accent-danger: #f43f5e;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-base); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
        
        header { background: #0f172a; border-bottom: 1px solid var(--border-glow); padding: 0 30px; height: 65px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .logo-section { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
        .logo-section span { color: var(--accent-cyan); }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #1e293b; border: 1px solid var(--border-glow); color: var(--text-muted); padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s ease; }
        .tab-btn.active { color: var(--text-primary); background: var(--accent-violet); box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }
        .drawer-trigger { background: transparent; border: 1px solid var(--border-glow); color: var(--accent-emerald); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }

        .main-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; height: calc(100vh - 65px); }
        .view-pane { width: 100%; height: 100%; display: none; padding: 25px; overflow-y: auto; box-sizing: border-box; }
        .view-pane.active { display: grid; }

        /* Tab 1 Structure */
        .manual-grid { grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .glass-card { background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px; height: fit-content; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .card-title { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--border-glow); padding-bottom: 12px; color: var(--accent-cyan); }
        .formula-box { background: var(--bg-nested); padding: 14px; border-radius: 8px; border-left: 4px solid var(--accent-cyan); font-family: monospace; color: var(--accent-cyan); font-size: 15px; margin: 4px 0; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        .code-container { font-family: monospace; background: var(--bg-nested); padding: 18px; border-radius: 8px; color: #34d399; font-size: 13px; overflow-x: auto; white-space: pre; border: 1px solid var(--border-glow); line-height: 1.5; }
        .exp-item { display: flex; gap: 12px; font-size: 13px; border-bottom: 1px dashed var(--border-glow); padding-bottom: 10px; margin-top: 5px; }
        .exp-item strong { color: var(--text-primary); font-family: monospace; min-width: 110px; }

        /* Tab 2 Structure */
        .arena-grid { grid-template-columns: 320px 1fr; gap: 25px; height: 100%; max-width: 1600px; margin: 0 auto; width: 100%; }
        .sidebar-controls { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow-y: auto; }
        .slider-wrap { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--accent-violet); background: #1e293b; height: 6px; border-radius: 4px; outline: none; cursor: pointer; }
        .slider-val { font-family: monospace; font-size: 13px; min-width: 35px; color: var(--accent-cyan); text-align: right; }
        .btn-toggle-row { display: flex; gap: 8px; }
        .toggle-btn { flex: 1; background: #1e293b; border: 1px solid var(--border-glow); color: var(--text-muted); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .toggle-btn.active { background: rgba(6, 182, 212, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .preset-btn { width: 100%; background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.25); color: #c084fc; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; display: flex; align-items: center; justify-content: space-between; }
        .preset-btn:hover { background: var(--accent-violet); color: var(--text-primary); }
        .challenge-box { background: rgba(244, 63, 94, 0.04); border: 1px solid rgba(244, 63, 94, 0.2); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
        .challenge-box strong { color: var(--accent-danger); font-size: 13px; text-transform: uppercase; }
        .system-status { background: var(--bg-nested); padding: 14px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 13px; border: 1px solid var(--border-glow); text-transform: uppercase; }
        .status-stable { color: var(--accent-emerald); }
        .status-warning { color: var(--accent-danger); }
        
        .canvas-area { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        .metrics-row { display: flex; gap: 20px; flex-shrink: 0; }
        .metric-card { flex: 1; background: var(--bg-nested); border: 1px solid var(--border-glow); border-radius: 10px; padding: 14px 20px; display: flex; flex-direction: column; gap: 4px; }
        .metric-num { font-family: monospace; font-size: 22px; font-weight: 700; }
        #canvasContainer { flex: 1; background: #010409; border-radius: 14px; border: 1px solid var(--border-glow); position: relative; overflow: hidden; min-height: 320px; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .notebook-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-glow); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; margin-top: 4px; flex-shrink: 0; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 10px; }
        .run-btn { background: var(--accent-emerald); color: var(--bg-nested); border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .input-row { display: flex; gap: 12px; align-items: center; background: var(--bg-nested); border: 1px solid var(--border-glow); padding: 12px; border-radius: 8px; }
        .prompt-symbol { font-family: monospace; font-weight: 700; color: var(--accent-cyan); font-size: 16px; }
        .console-input { background: transparent; border: none; outline: none; color: var(--text-primary); font-family: monospace; font-size: 14px; flex: 1; }
        .terminal-output { background: #020617; border: 1px solid var(--border-glow); padding: 14px; border-radius: 8px; min-height: 80px; font-family: monospace; font-size: 13px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        
        /* Drawer Pipeline */
        .backend-drawer { position: absolute; right: -400px; top: 0; width: 400px; height: 100%; background: #0a0e1a; border-left: 2px solid var(--border-glow); z-index: 100; transition: right 0.3s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; padding: 25px; gap: 20px; box-shadow: -15px 0 40px rgba(0,0,0,0.6); }
        .backend-drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 12px; }
        .close-drawer { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; }
        .flow-timeline { display: flex; flex-direction: column; gap: 16px; }
        .flow-step { display: flex; gap: 14px; opacity: 0.35; }
        .flow-step.active { opacity: 1; }
        .step-node { width: 24px; height: 24px; border-radius: 50%; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
        .flow-step.active .step-node { background: var(--bg-nested); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .step-text h4 { font-size: 13px; font-weight: 600; }
        .step-text p { font-size: 12px; color: var(--text-muted); }
        .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
        .mini-widget { background: var(--bg-nested); border: 1px solid var(--border-glow); padding: 12px; border-radius: 6px; }
        .widget-val { font-family: monospace; font-size: 14px; font-weight: 700; color: var(--accent-emerald); }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">OCTAVE<span>LABS</span></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('manual', this)">Interactive Manual</button>
            <button class="tab-btn" onclick="switchTab('arena', this)">Simulation Arena</button>
        </div>
        <button class="drawer-trigger" onclick="toggleDrawer()">How Backend Works</button>
    </header>

    <div class="main-wrapper">
        <!-- TAB 1 View -->
