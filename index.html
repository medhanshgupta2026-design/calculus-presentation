<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Calculus Lab — Interactive Live Presentation Suite</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes aurora {
      0% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
      50% { transform: scale(1.15) translate(25px, -15px) rotate(5deg); }
      100% { transform: scale(0.95) translate(-20px, 20px) rotate(-4deg); }
    }
    @keyframes spinSlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-aurora {
      animation: aurora 14s ease-in-out infinite alternate;
    }
    .animate-spin-slow {
      animation: spinSlow 20s linear infinite;
    }
    .glow-cyan {
      box-shadow: 0 0 25px rgba(34, 211, 238, 0.25), 0 0 50px rgba(34, 211, 238, 0.08);
    }
    .glow-emerald {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25), 0 0 50px rgba(16, 185, 129, 0.08);
    }
    .glow-violet {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.25), 0 0 50px rgba(168, 85, 247, 0.08);
    }
    .glow-amber {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25), 0 0 50px rgba(245, 158, 11, 0.08);
    }
    .text-glow-cyan {
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
    }
    .text-glow-emerald {
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }
    .text-glow-violet {
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
    }
